name: Notify IndexNow after site deployment
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the same commit to finish Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=''
          for attempt in $(seq 1 36); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")][0] | if . then (.status + ":" + (.conclusion // "")) else "pending" end' 2>/dev/null || true)
            if [ "$state" = 'completed:success' ]; then break; fi
            if [[ "$state" == completed:* ]]; then echo 'Pages deployment did not succeed.'; exit 1; fi
            sleep 10
          done
          if [ "$state" != 'completed:success' ]; then echo 'Timed out waiting for Pages deployment.'; exit 1; fi
      - name: Notify IndexNow of the published pages
        run: |
          curl --fail-with-body --silent --show-error --retry 2  -H 'Content-Type: application/json; charset=utf-8'  --data '{"host":"liecranesupport-ai.github.io","key":"d03488c51ac4c3ee523ae123f1c8d1fb","keyLocation":"https://liecranesupport-ai.github.io/LIE-CRANE-V2/d03488c51ac4c3ee523ae123f1c8d1fb.txt","urlList":["https://liecranesupport-ai.github.io/LIE-CRANE-V2/","https://liecranesupport-ai.github.io/LIE-CRANE-V2/ar/","https://liecranesupport-ai.github.io/LIE-CRANE-V2/ios/"]}'  https://api.indexnow.org/indexnow
