<text x="457" y="146" font-size="18" fill="#FFD26F">02</text><text x="508" y="146" font-size="22" fill="#F4F7F9" font-weight="700">SELECT DATE</text>
<rect x="456" y="174" width="288" height="86" rx="12" fill="#09131A" stroke="#A38848"/>
<text x="475" y="230" fill="#F5F7F9" font-size="35" font-weight="700">17 / 10 / 2020</text>
<text x="459" y="292" font-size="15" fill="#F3C861">Historical dates supported</text>
<path d="M778 210h36m-10-10 10 10-10 10" fill="none" stroke="#22C9AA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
