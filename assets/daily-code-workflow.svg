<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">LIE_CRANE V2 - Daily Code calculation workflow</title>
<desc id="desc">Illustrated workflow: enter crane serial, choose date including previous dates, view three levels of results. Not an actual screenshot.</desc>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101920"/><stop offset="1" stop-color="#091016"/></linearGradient></defs>
<rect width="1200" height="360" fill="url(#g)" rx="24"/>
<text x="45" y="50" font-family="Arial,sans-serif" font-size="20" letter-spacing="4" fill="#F6CA65" font-weight="700">DAILY CODE WORKFLOW</text>
<text x="45" y="78" font-family="Arial,sans-serif" font-size="17" fill="#9FB0BB">Select your own calculation date. No need to be limited to today.</text>
<g font-family="Arial,sans-serif">
<rect x="40" y="105" width="334" height="213" rx="20" fill="#15222A" stroke="#3A5260" stroke-width="2"/>
<text x="64" y="146" font-size="18" fill="#FFD26F">01</text><text x="115" y="146" font-size="22" fill="#F4F7F9" font-weight="700">CRANE SERIAL</text>
<rect x="64" y="174" width="286" height="86" rx="12" fill="#09131A" stroke="#4C626A"/>
<text x="88" y="229" fill="#F4F7F9" font-size="44" font-weight="700">••••••</text>
<text x="66" y="292" font-size="15" fill="#ADBDC7">Leading zeros preserved</text>
<path d="M385 210h36m-10-10 10 10-10 10" fill="none" stroke="#22C9AA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
