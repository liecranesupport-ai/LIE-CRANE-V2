<text x="849" y="146" font-size="18" fill="#FFD26F">03</text><text x="899" y="146" font-size="22" fill="#F4F7F9" font-weight="700">CODE RESULTS</text>
<g font-size="18" font-weight="700"><rect x="850" y="170" width="285" height="37" rx="9" fill="#0C2D29"/><text x="868" y="195" fill="#63D0A2">LEVEL 1</text>
