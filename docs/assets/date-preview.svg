<svg xmlns="http://www.w3.org/2000/svg" width="760" height="940" viewBox="0 0 760 940" role="img" aria-labelledby="title description">
<title id="title">LIE_CRANE V2 — Select a previous calculation date</title>
<desc id="description">Illustrative preview inspired by the genuine crane calculator input screen: serial 55555, manually selected 17 October 2020, and a Use Today option. No access code is shown.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15252d"/><stop offset="1" stop-color="#07141c"/></linearGradient>
<linearGradient id="gr" x1="0" y1="0" x2="1"><stop stop-color="#ffe0a3"/><stop offset="1" stop-color="#edbe61"/></linearGradient>
</defs>
<rect width="760" height="940" rx="36" fill="url(#bg)"/>
<rect x="28" y="28" width="704" height="884" rx="30" fill="#0b161d" stroke="#2b434a" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="380" y="86" text-anchor="middle" fill="#f1c873" letter-spacing="7" font-size="18" font-weight="700">CRANE CALCULATOR</text>
<rect x="65" y="124" width="82" height="79" rx="19" fill="#363729"/>
<text x="106" y="174" text-anchor="middle" font-size="34" font-weight="700" fill="#f7cf78">01</text>
<text x="177" y="162" font-size="35" font-weight="700" fill="#f5f7f8">Calculation details</text>
<text x="177" y="194" font-size="17" fill="#b8c8cb">Enter the crane serial and choose a date</text>
<rect x="65" y="237" width="630" height="522" rx="34" stroke="#405760" stroke-width="2" fill="#142128"/>
<text x="105" y="279" font-size="16" fill="#ccd3d4" letter-spacing="2">CRANE SERIAL</text>
<rect x="105" y="299" width="550" height="101" rx="22" fill="#0b161d" stroke="#51656c" stroke-width="2"/>
<text x="132" y="365" font-size="43" font-weight="700" letter-spacing="5" fill="#fff">55555</text>
<text x="105" y="443" font-size="17" fill="#bac8cb">Leading zeros are preserved.</text>
<text x="105" y="514" font-size="18" font-weight="700" fill="#f1c873">CALCULATION DATE</text>
<text x="652" y="514" text-anchor="end" font-size="18" font-weight="700" fill="#f1c873">USE TODAY</text>
<g fill="#0b161d" stroke="#51656c" stroke-width="2">
<rect x="105" y="548" width="165" height="116" rx="18"/>
<rect x="285" y="548" width="165" height="116" rx="18"/>
</g>
<rect x="465" y="548" width="190" height="116" rx="18" fill="#0b161d" stroke="#f3c568" stroke-width="4"/>
<g font-size="15" fill="#b7c5c8"><text x="125" y="573">DAY</text><text x="305" y="573">MONTH</text><text x="485" y="573">YEAR</text></g>
<g font-size="39" fill="#fff"><text x="129" y="636">17</text><text x="309" y="636">10</text><text x="489" y="636">2020</text></g>
<text x="105" y="707" font-size="16" fill="#b7c5c8">The date can be changed to match the crane.</text>
<rect x="65" y="792" width="630" height="77" rx="22" fill="#29c4b0"/>
<text x="380" y="843" text-anchor="middle" font-size="30" font-weight="800" fill="#07161b">CALCULATE</text>
<text x="380" y="896" font-size="13" fill="#9baeb2" text-anchor="middle">ILLUSTRATIVE UI PREVIEW · NOT A WORKING CALCULATOR</text>
</g>
</svg>